loader_version_range=[1,)

# Mod
mod_id=dtmodverify
mod_name=Dungeon Train Mod Verification
mod_license=PolyForm Shield 1.0.0
mod_version=0.1.0
mod_group_id=games.brennan.dtmodverify
mod_authors=Brennan Hatton
mod_description=Verifies installed mod files by hash and code fingerprint so Dungeon Train's Free Play check can tell a genuine build of an approved mod from a look-alike. No gameplay changes on its own.
